services:
  web:
    build: .
    image: portfolio:latest
    container_name: portfolio-web
    restart: unless-stopped
    env_file: .env.production
    ports:
      # Bind localhost only — Nginx fronts public traffic with TLS.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
