# aldirifai.com — Nginx reverse proxy in front of the Next.js standalone
# container running on 127.0.0.1:3000. SSL via Let's Encrypt (certbot).

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aldirifai.com www.aldirifai.com;

    # Lets Certbot serve ACME challenges over HTTP without forcing redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aldirifai.com$request_uri;
    }
}

# ── www → apex redirect (HTTPS) ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aldirifai.com;

    ssl_certificate     /etc/letsencrypt/live/aldirifai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aldirifai.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aldirifai.com$request_uri;
}

# ── apex (HTTPS) — proxies to Next.js ──────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aldirifai.com;

    ssl_certificate     /etc/letsencrypt/live/aldirifai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aldirifai.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Long-cache hashed Next.js static assets — content-addressable, safe.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same treatment for static favicons / manifest icons.
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # All other routes → Next.js standalone server.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # Send 404s for hidden files.
    location ~ /\. { deny all; }
}
